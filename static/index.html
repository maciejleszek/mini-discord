<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Discord</title>
    <style>
        /* Globalne style */
        body {
            background: #313338;
            color: #dbdee1;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel boczny (Sidebar) */
        .sidebar {
            width: 240px;
            background: #2b2d31;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e1f22;
            padding: 15px;
            box-sizing: border-box;
        }

        .sidebar h3 {
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid #3f4147;
            padding-bottom: 10px;
        }

        #my-id {
            font-size: 11px;
            color: #949ba4;
            margin-bottom: 10px;
            word-break: break-all;
        }

        /* Główny obszar (Main) */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
        }

        /* Czat */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            background: #383a40;
            padding: 10px 14px;
            border-radius: 8px;
            width: fit-content;
            max-width: 80%;
            line-height: 1.4;
        }

        .msg b {
            color: #5865f2;
            margin-right: 8px;
            font-size: 14px;
        }

        /* Pole wpisywania */
        .input-box {
            padding: 20px;
            background: #313338;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #383a40;
            color: white;
            outline: none;
            box-sizing: border-box;
            font-size: 15px;
        }

        /* Przyciski i Kontrolki Głosu */
        .voice-controls {
            margin-top: auto;
            background: #232428;
            padding: 15px;
            border-radius: 8px;
        }

        button {
            background: #5865f2;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background: #4752c4; }

        #mute-btn { background: #4e5058; margin-bottom: 8px; }
        #mute-btn:hover { background: #6d6f78; }

        #leave-btn { background: #da373c; }
        #leave-btn:hover { background: #a12828; }

        #user-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>
    <div class="sidebar">
        <h3># ogólny</h3>

        <div id="user-list">
            </div>

        <div id="my-id">Inicjalizacja...</div>

        <div class="voice-controls">
            <button id="voice-btn">Połącz Głos</button>
            <div id="active-controls" style="display: none; flex-direction: column;">
                <button id="mute-btn">Wycisz Mikrofon</button>
                <button id="leave-btn">Rozłącz się</button>
            </div>
        </div>
    </div>

    <div class="main">
        <div id="chat"></div>
        <div class="input-box">
            <input type="text" id="msg-input" placeholder="Napisz do kolegów na #ogólny...">
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
