<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3kipa</title>
    <style>
        :root {
            --bg-dark: #1e1f22;
            --bg-main: #313338;
            --bg-side: #2b2d31;
            --accent: #5865f2;
            --success: #23a559;
            --danger: #da373c;
            --text: #dbdee1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100dvh;
            overflow: hidden;
        }

        /* ── LOGIN ── */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: var(--bg-main);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-box h2 { margin-top: 0; color: white; }

        .login-box input {
            width: 100%;
            margin-bottom: 10px;
            display: block;
        }

        .login-box button { width: 100%; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 220px;
            background: var(--bg-side);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--bg-dark);
            flex-shrink: 0;
        }

        .sidebar-section { padding: 12px 15px; }
        .sidebar-label { font-size: 0.72rem; color: #949ba4; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }

        /* ── VOICE CARD ── */
        .voice-card {
            background: #232428;
            margin: 0 10px 10px;
            padding: 12px;
            border-radius: 10px;
        }

        #v-status { font-size: 0.72rem; color: #949ba4; margin-bottom: 8px; }

        #meter-container {
            width: 100%;
            height: 8px;
            background: #111;
            border-radius: 4px;
            margin-bottom: 10px;
            display: none;
            overflow: hidden;
            border: 1px solid #444;
        }

        #meter-bar {
            width: 0%;
            height: 100%;
            background: var(--success);
            transition: width 0.05s;
            border-radius: 4px;
        }

        #active-controls {
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        /* ── MAIN CHAT ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            min-width: 0;
        }

        .chat-header {
            padding: 12px 15px;
            border-bottom: 1px solid var(--bg-dark);
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Scrollbar */
        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: #4e5058; border-radius: 3px; }

        .msg {
            background: #383a40;
            padding: 9px 13px;
            border-radius: 10px;
            max-width: 85%;
            align-self: flex-start;
            word-wrap: break-word;
            word-break: break-word;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg b {
            color: var(--accent);
            font-size: 0.82rem;
            display: block;
            margin-bottom: 3px;
        }

        .msg img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
            border: 1px solid #4e5058;
        }

        .msg-time {
            color: #949ba4;
            font-size: 0.68rem;
            font-weight: normal;
            margin-left: 6px;
        }

        /* ── INPUT AREA ── */
        .input-area {
            padding: 10px 12px;
            background: var(--bg-main);
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid var(--bg-dark);
        }

        input[type="text"],
        input[type="password"] {
            background: #383a40;
            border: none;
            color: white;
            padding: 11px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder { color: #72767d; }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 11px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: filter 0.15s;
        }

        button:hover { filter: brightness(1.1); }
        button:active { filter: brightness(0.9); }

        .btn-icon {
            background: #4e5058;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .btn-icon:hover { background: #5c5f66; }

        /* ── MOBILE ── */
        @media (max-width: 640px) {
            body { flex-direction: column; }

            .sidebar {
                width: 100%;
                order: 2;
                border-right: none;
                border-top: 1px solid var(--bg-dark);
                flex-direction: row;
                align-items: center;
                padding: 6px 10px;
                gap: 10px;
            }

            .sidebar-section { padding: 4px 0; }
            .voice-card { margin: 0; flex: 1; }

            .main {
                order: 1;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>3kipa tego typu</h2>
            <input type="text" id="nick" placeholder="Nick (Maciek / Samuel / Kris)">
            <input type="password" id="pass" placeholder="Hasło">
            <button id="login-btn">Zaloguj się</button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Online</div>
            <div id="user-list" style="color: var(--success); font-weight: bold; font-size: 0.9rem; line-height: 1.6;"></div>
        </div>

        <div class="voice-card">
            <div id="v-status">Głos: Rozłączony</div>
            <div id="meter-container"><div id="meter-bar"></div></div>
            <button id="voice-btn" style="width:100%; margin-bottom: 0;">🎙️ Połącz Głos</button>
            <div id="active-controls">
                <button id="mute-btn" style="background: #4e5058;">Wycisz 🔇</button>
                <button id="leave-btn" style="background: var(--danger);">Rozłącz</button>
            </div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="chat-header">
            💬 #ogólny
        </div>

        <div id="chat"></div>

        <div class="input-area">
            <label class="btn-icon" title="Wyślij zdjęcie">
                📷
                <input type="file" id="img-input" accept="image/*" style="display:none">
            </label>
            <input type="text" id="msg-input" placeholder="Napisz wiadomość..." style="flex:1">
            <button id="send-btn" title="Wyślij">➤</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
