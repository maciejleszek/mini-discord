<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Discord Pro</title>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --discord-blue: #5865f2; }
        body { background: var(--bg-main); color: #dbdee1; font-family: sans-serif; margin: 0; display: flex; height: 100vh; }

        /* Responsywność */
        .sidebar {
            width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column;
            padding: 15px; border-right: 1px solid #1e1f22; transition: 0.3s;
        }

        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: #383a40; padding: 8px 12px; border-radius: 8px; width: fit-content; max-width: 90%; word-break: break-word; }
        .msg b { color: var(--discord-blue); font-size: 0.9rem; display: block; }

        .input-box { padding: 15px; background: var(--bg-main); }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #383a40; color: white; outline: none; box-sizing: border-box; }

        .voice-controls { margin-top: auto; background: #232428; padding: 10px; border-radius: 8px; }
        button { background: var(--discord-blue); color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* Style dla Telefonu */
        @media (max-width: 600px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #1e1f22; padding: 10px; }
            #user-list { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; margin-bottom: 5px; }
            .voice-controls { display: flex; gap: 5px; padding: 5px; }
            button { margin-top: 0; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3 style="margin: 0 0 10px 0; font-size: 1rem;"># ogólny</h3>
        <div id="user-list" style="font-size: 0.8rem; color: #23a559; margin-bottom: 10px;"></div>
        <div id="my-id" style="font-size: 0.7rem; color: #949ba4; margin-bottom: 10px;"></div>
        <div class="voice-controls">
            <button id="voice-btn">Połącz Głos</button>
            <div id="active-controls" style="display: none; width: 100%;">
                <button id="mute-btn" style="background: #4e5058;">Mute</button>
                <button id="leave-btn" style="background: #da373c;">Rozłącz</button>
            </div>
        </div>
    </div>
    <div class="main">
        <div id="chat"></div>
        <div class="input-box">
            <input type="text" id="msg-input" placeholder="Wiadomość...">
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
