<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Discord</title>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --discord-blue: #5865f2; --text-muted: #949ba4; }
        body { background: var(--bg-main); color: #dbdee1; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        #login-overlay { position: fixed; inset: 0; background: #1e1f22; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--bg-main); padding: 30px; border-radius: 8px; text-align: center; width: 300px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

        .sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #1e1f22; box-sizing: border-box; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #383a40; padding: 10px; border-radius: 8px; width: fit-content; max-width: 85%; word-wrap: break-word; }
        .msg b { color: var(--discord-blue); font-size: 0.9rem; }
        .msg-time { font-size: 0.7rem; color: var(--text-muted); font-weight: normal; margin-left: 5px; }
        .chat-img { max-width: 100%; border-radius: 5px; margin-top: 5px; cursor: pointer; display: block; border: 1px solid #4e5058; }

        .input-box { padding: 20px; display: flex; gap: 10px; align-items: center; background: var(--bg-main); }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 5px; border: none; background: #383a40; color: white; outline: none; }

        .voice-section { margin-top: auto; background: #232428; padding: 10px; border-radius: 8px; }
        #user-list { color: #23a559; font-size: 0.9rem; margin-bottom: 10px; overflow-y: auto; min-height: 50px; line-height: 1.4; }

        button { background: var(--discord-blue); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }

        @media (max-width: 600px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; }
            #user-list { display: flex; gap: 10px; flex-wrap: wrap; }
            .voice-section { display: flex; gap: 5px; padding: 5px; }
        }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color: white; margin-top: 0;">Mini Discord</h2>
            <input type="text" id="nickname-input" placeholder="Wpisz swój nick..." style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 5px; border: none; box-sizing: border-box; background: #383a40; color: white;">
            <button id="start-btn">Wejdź na serwer</button>
        </div>
    </div>

    <div class="sidebar">
        <h3 style="margin-top: 0;"># ogólny</h3>
        <div id="user-list"><b>Online:</b><br></div>
        <div id="my-id" style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px;"></div>
        <div class="voice-section">
            <button id="voice-btn">Połącz Głos</button>
            <div id="active-controls" style="display: none; flex-direction: column; width: 100%;">
                <button id="mute-btn" style="background: #4e5058;">Mute</button>
                <button id="leave-btn" style="background: #da373c;">Rozłącz</button>
            </div>
        </div>
    </div>

    <div class="main">
        <div id="chat"></div>
        <div class="input-box">
            <label for="image-input" style="cursor: pointer; background: #4e5058; padding: 10px; border-radius: 5px; font-size: 1.2rem;">📷</label>
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <input type="text" id="msg-input" placeholder="Napisz wiadomość...">
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
